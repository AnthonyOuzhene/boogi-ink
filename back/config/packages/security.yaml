security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Super admin (développeur) = droits de l'admin (salon) + rubriques réservées.
    # Voir HomeCrudController, UserCrudController et Security\Voter\AdminUserVoter.
    role_hierarchy:
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # API entièrement publique (lecture + dépôt d'avis, modérés au backoffice).
        # AVANT "main" : le premier pare-feu qui correspond l'emporte, /api n'ouvre jamais de session.
        api:
            pattern: ^/api
            security: false

        # Backoffice EasyAdmin
        main:
            lazy: true
            provider: app_user_provider

            # Page /boogi-0806/login, rendue par SecurityController
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: admin

            # Anti-robots : 5 échecs (même email, même IP) => bloqué 15 min. Requiert symfony/rate-limiter.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: app_logout
                target: app_login

    # Seule la PREMIÈRE règle qui correspond s'applique : l'ordre compte.
    # Préfixe du backoffice : identique au routePath de DashboardController.
    access_control:
        # Connexion AVANT la règle admin, sinon il faudrait être connecté pour se connecter
        - { path: ^/boogi-0806/login$, roles: PUBLIC_ACCESS }
        # Super admin seulement : cartes de l'accueil et engagements "Hygiène & sécurité".
        # AVANT la règle générale, sinon un admin passerait par celle-ci.
        # (Voir aussi DashboardController et ContentChecklist.)
        - { path: ^/boogi-0806/(home-card|hygiene-commitment), roles: ROLE_SUPER_ADMIN }
        - { path: ^/boogi-0806, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Coût de hachage minimal en test, pour la rapidité
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
